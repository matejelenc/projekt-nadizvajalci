[project]
name = "projekt-nadizvajalci"
version = "0.1.0"
description = "Geographic analysis of news."
readme = "README.md"
requires-python = "==3.11.*"

# Shared dependencies (installed in all environments)
dependencies = [
    "pandas",
]

[project.optional-dependencies]
nlp = [
    "classla",
    "pyyaml",
    "torch>=2.6.0",
    "transformers",
    "tqdm",
]

app = [
    "flask",
    "graphdatascience",
    "matplotlib",
    "neo4j",
    "networkx",
    "numpy",
    "plotly",
    "scikit-learn",
    "scipy",
    "umap-learn",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }