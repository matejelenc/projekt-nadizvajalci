services:
  neo4j:
    build: ./docker/db
    container_name: uozp_neo4j
    ports:
      - ${NEO4J_HTTP_PORT:-7474}:${NEO4J_HTTP_PORT:-7474}
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${DB_USER}/${DB_PASSWORD}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"] 
    volumes:
      - ./data/db:/data
      - ./logs/db:/logs